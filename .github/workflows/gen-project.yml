name: Generate Xcode project
on:
  push:
    paths: [CallBridge/project.yml, .github/workflows/gen-project.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run xcodegen (docker, linux runner — no mac queue)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/CallBridge:/src" -w /src \
            --entrypoint xcodegen yonaskolb/xcodegen:latest generate
      - name: Commit generated project into the repo
        run: |
          ls CallBridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CallBridge/CallBridge.xcodeproj
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Check in CallBridge.xcodeproj (so Codemagic skips xcodegen)"
          git push
