name: Generate Xcode project
on:
  push:
    branches: [main]
    paths: [CallBridge/project.yml, .github/workflows/gen-project.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run xcodegen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd CallBridge && xcodegen generate && ls
      - name: Commit generated project into the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CallBridge/CallBridge.xcodeproj
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Check in CallBridge.xcodeproj (Codemagic skips xcodegen)"
          git push
