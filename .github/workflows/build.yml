name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project CallBridge.xcodeproj -scheme CallBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CallBridge.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry CallBridge.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallBridge-ipa
          path: build/CallBridge.ipa
