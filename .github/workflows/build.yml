name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    # two runners = two tickets in the macOS queue; first to land wins
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if [ "$(uname -m)" = "arm64" ]; then ARCH="arm64"; else ARCH="x86_64"; fi
          curl -sL "https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.2.43.0.zip" -o xg.zip
          unzip -q xg.zip
          sudo cp xcodegen/bin/xcodegen /usr/local/bin/
          xcodegen --version || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild -project CallBridge.xcodeproj -scheme CallBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CallBridge.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry CallBridge.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallBridge-ipa-${{ matrix.runner }}
          path: build/CallBridge.ipa
