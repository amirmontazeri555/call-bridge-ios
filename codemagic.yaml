# Codemagic CI — builds the unsigned IPA.
# The Xcode project is checked into the repo (generated by the GitHub Actions
# linux workflow gen-project.yml whenever project.yml changes), so this
# workflow only clones, runs xcodebuild and uploads the IPA.
# Free tier: 500 mac build minutes/month.

workflows:
  ipa:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          set -e
          cd CallBridge
          xcodebuild -project CallBridge.xcodeproj -scheme CallBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ../build/CallBridge.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ..
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry CallBridge.ipa Payload
    artifacts:
      - build/CallBridge.ipa
