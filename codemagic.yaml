# Codemagic CI — builds the unsigned IPA (same recipe as the GitHub Actions
# workflow, but on Codemagic's own Mac mini M2 machines, no GitHub mac queue).
#
# Free tier: 500 mac build minutes/month, 1 concurrency.
# Setup: codemagic.io -> sign in with GitHub -> add application (amirmontazeri555/call-bridge-ios)
#        -> select workflow "ipa" -> Start build. IPA lands in the artifacts list.

workflows:
  ipa:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode project
        script: |
          cd CallBridge && xcodegen generate
      - name: Build unsigned IPA
        script: |
          cd CallBridge
          xcodebuild -project CallBridge.xcodeproj -scheme CallBridge \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CallBridge.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/CallBridge.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry CallBridge.ipa Payload
    artifacts:
      - build/CallBridge.ipa
