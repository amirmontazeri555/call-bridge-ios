name: CallBridge
options:
  bundleIdPrefix: com.amir
  deploymentTarget:
    iOS: "16.0"
targets:
  CallBridge:
    type: application
    platform: iOS
    sources: [CallBridge]
    info:
      path: CallBridge/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [voip, audio]
        NSLocalNetworkUsageDescription: "برای دریافت تماس‌های رله از Wi-Fi خانه"
        NSBonjourServices: []
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: false
